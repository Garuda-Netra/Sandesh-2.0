{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Sandesh</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32x32.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/custom.css' %}?v=11">

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('sandesh_theme');
        var theme = saved || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch(e) {}
    })();
  </script>

  <style>
    @keyframes sdh-pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 0.5; }
    }
    .sdh-offline-pulse {
      animation: sdh-pulse-slow 3s infinite ease-in-out;
    }
  </style>
</head>

<body class="bg-divine-deep text-divine-text min-h-screen flex items-center justify-center p-4 antialiased selection:bg-purple-500 selection:text-white">
  <div class="w-full max-w-md bg-divine-card border border-divine-border rounded-3xl p-8 shadow-2xl text-center backdrop-blur-xl relative overflow-hidden">
    
    <!-- Top glowing accent -->
    <div class="absolute -top-16 -left-16 w-36 h-36 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -right-16 w-36 h-36 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Offline Visual Badge -->
    <div class="flex justify-center mb-6">
      <div class="relative w-20 h-20 flex items-center justify-center rounded-2xl bg-purple-500/10 border border-purple-500/20 sdh-offline-pulse">
        <svg class="w-10 h-10 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" 
                d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829M1.636 1.636l20.728 20.728M8.464 8.464a5 5 0 00-.772 6.071m-2.056-8.9a9 9 0 00-.772 12.02M12 12v.01" />
        </svg>
      </div>
    </div>

    <!-- Heading & Text -->
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-divine-text mb-3">
      You're Offline
    </h1>
    <p class="text-sm text-divine-muted leading-relaxed mb-8">
      Sandesh is ready when you are. Please check your Wi-Fi or mobile data connection to reconnect to your conversations.
    </p>

    <!-- Status pill -->
    <div id="connectionStatus" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-300 text-xs font-medium mb-6">
      <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
      Waiting for internet connection...
    </div>

    <!-- Action Button -->
    <button id="retryBtn" onclick="handleRetry()" 
            class="sdh-liquid-btn btn-ancient w-full py-3.5 px-6 rounded-xl font-semibold flex items-center justify-center gap-2 shadow-lg transition-all active:scale-[0.98]">
      <svg id="retryIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span id="retryText">Retry Connection</span>
    </button>

    <!-- Attribution -->
    <p class="text-center text-[10px] mt-8 tracking-widest text-zinc-500 uppercase select-none">
      Sandesh Progressive Web App
    </p>
  </div>

  <script>
    function handleRetry() {
      const btn = document.getElementById('retryBtn');
      const icon = document.getElementById('retryIcon');
      const text = document.getElementById('retryText');
      const status = document.getElementById('connectionStatus');

      icon.classList.add('animate-spin');
      text.textContent = 'Checking connection...';

      if (navigator.onLine) {
        status.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> Back online! Reloading...';
        status.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-500/10 border border-green-500/30 text-green-600 dark:text-green-300 text-xs font-medium mb-6';
        setTimeout(() => {
          window.location.reload();
        }, 800);
      } else {
        setTimeout(() => {
          icon.classList.remove('animate-spin');
          text.textContent = 'Retry Connection';
          status.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Still disconnected. Check network settings.';
          status.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-300 text-xs font-medium mb-6';
        }, 1200);
      }
    }

    // Auto-reload when network restores
    window.addEventListener('online', () => {
      handleRetry();
    });
  </script>
</body>
</html>
